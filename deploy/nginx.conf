# Caddy 대신 nginx를 쓰는 경우. certbot으로 인증서를 따로 받아야 한다.
#   sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/floorplan;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; frame-ancestors 'self'" always;

    location = /grid      { return 301 /grid-editor.html; }
    location = /syntax    { return 301 /syntax-report.html; }
    location = /benchmark { return 301 /benchmark-report.html; }

    location ~* \.html$ { add_header Cache-Control "no-cache, must-revalidate"; }
    location ~* \.(css|js|woff2|png|jpg|svg|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; }

    location / { try_files $uri $uri/ =404; }
}
